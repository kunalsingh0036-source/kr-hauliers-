<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thank you — KR Hauliers</title><style>body{margin:0;background:#071e3a;color:white;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{max-width:650px;padding:50px}.ey{color:#ffd229;font-weight:900;letter-spacing:.15em;font-size:12px}h1{font-size:64px;line-height:.95;margin:18px 0}p{color:#cbd6e3;line-height:1.6;font-size:18px}a{display:inline-block;margin-top:22px;background:#ffd229;color:#071e3a;padding:14px 18px;text-decoration:none;font-weight:800}</style></head><body><div class="box"><img src="/kr-logo.webp" alt="KR Hauliers" width="200" height="100" style="filter:brightness(0) invert(1);object-fit:contain"><h1 id="title">Let’s move your cargo.</h1><p id="message">Return to the website to send a transport enquiry.</p><a href="/">Return to website</a></div><script>let received=false;try{received=sessionStorage.getItem('kr-enquiry-received')==='1';sessionStorage.removeItem('kr-enquiry-received')}catch{}if(received){document.getElementById('title').textContent='Thank you.';document.getElementById('message').textContent='Your enquiry has been received. Our team will contact you by email to discuss your cargo, route and quote. Your truck booking is not yet confirmed.'}</script></body></html>
